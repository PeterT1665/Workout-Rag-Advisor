# Deploys the website to Cloudflare Pages: only on merge to main when web/ changed, or by hand.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; skips the upload until they exist.
name: Deploy

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'sport-coach' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The public site is the guest/demo build: no personal photos, no server needed.
      - run: npm run build:demo
      - if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Cloudflare secrets not set yet; built but not deployed."
      - if: env.HAS_TOKEN == 'true'
        run: npx --yes wrangler@4 pages deploy dist-demo --project-name="$PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
