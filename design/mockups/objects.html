<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>3D Objects</title>
<link rel="stylesheet" href="shared.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: var(--surface); padding: 6px 6px 12px; text-align: center; }
  .cell img { width: 100%; aspect-ratio: 1; display: block; }
  .cell .n { font-family: var(--wide); font-weight: 900; font-variation-settings: "wdth" 120; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="phone" style="min-height:0">
  <div class="eyebrow">3D objects · v3</div>
  <div style="font-family:var(--wide);font-weight:900;font-variation-settings:'wdth' 125;font-size:26px;text-transform:uppercase;margin:6px 0 16px">Kit</div>
  <div class="grid" id="grid"></div>
</div>
<script type="module">
import { THREE, makeBall, makeCone, makeGoal, makeBoot, makeBottle, makeDisc, makeHurdle, makeRing, makePole, COLORS, studio, contactShadow } from './objects3d.js'

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.setSize(640, 640)

function shot(obj, { cam, look, shadow = 2.2, rotY = 0 }) {
  const scene = new THREE.Scene()
  studio(renderer, scene)
  obj.rotation.y = rotY
  scene.add(obj)
  if (shadow) scene.add(contactShadow(shadow, 0.55))
  const c = new THREE.PerspectiveCamera(30, 1, 0.1, 100)
  c.position.set(...cam); c.lookAt(...look)
  renderer.render(scene, c)
  return renderer.domElement.toDataURL()
}

const items = [
  ['Ball', () => { const b = makeBall(); b.position.y = 1; b.rotation.set(0.4, 0.6, 0.1); return b }, { cam: [2.6, 2.6, 5.2], look: [0, 0.95, 0], shadow: 2.4 }],
  ['Cone', makeCone, { cam: [2.4, 2.6, 4.4], look: [0, 0.6, 0], shadow: 2.6 }],
  ['Boots', makeBoot, { cam: [2.4, 2.2, 4.8], look: [0, 0.5, 0], shadow: 3.2, rotY: 0.45 }],
  ['Water', makeBottle, { cam: [2.2, 2.4, 4.2], look: [0, 0.9, 0], shadow: 1.6 }],
  ['Disc markers', () => makeDisc({ stack: 5 }), { cam: [1.6, 2.0, 2.9], look: [0, 0.2, 0], shadow: 1.8 }],
  ['Hurdle', makeHurdle, { cam: [1.8, 1.6, 3.6], look: [0, 0.3, 0], shadow: 2.4, rotY: 0.4 }],
  ['Speed rings', () => { const g = new THREE.Group(); const a = makeRing(); const b = makeRing({ color: COLORS.red }); b.position.set(0.5, 0.06, 0.3); g.add(a, b); return g }, { cam: [1.6, 2.6, 3.0], look: [0.2, 0, 0.1], shadow: 0 }],
  ['Pole', makePole, { cam: [2.2, 1.6, 4.2], look: [0, 1.0, 0], shadow: 1.2 }],
  ['Goal', makeGoal, { cam: [6.5, 4.2, 12.5], look: [0, 1.0, -0.8], shadow: 0, rotY: 0.35 }],
]
const grid = document.getElementById('grid')
for (const [name, make, opts] of items) {
  const d = document.createElement('div'); d.className = 'cell'
  d.innerHTML = `<img src="${shot(make(), opts)}"><div class="n">${name}</div>`
  grid.append(d)
}
window.__ready = true
</script>
</body>
</html>
