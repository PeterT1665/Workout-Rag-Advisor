<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Mockup D</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Font B: wide & heavy */
  .w { font-family: var(--wide); font-weight: 900; font-variation-settings: "wdth" 125; text-transform: uppercase; letter-spacing: -.01em; line-height: .95; margin: 0; }
  .hero { position: relative; margin: 0 -16px; height: 360px; overflow: hidden; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero .over { position: absolute; left: 16px; right: 16px; bottom: 16px; }
  .skew { transform: skewX(-10deg); }
  .skew > * { transform: skewX(10deg); }
  .kick { display: inline-flex; align-items: center; gap: 10px; background: var(--red); color: #fff; padding: 0 26px; min-height: 54px; font-family: var(--wide); font-weight: 900; font-variation-settings: "wdth" 125; font-size: 17px; letter-spacing: .02em; box-shadow: 0 6px 0 #8f0018; }
  .sticker { display: inline-block; transform: rotate(-4deg); background: var(--red); color: #fff; font-family: var(--wide); font-weight: 900; font-variation-settings: "wdth" 125; font-size: 12px; letter-spacing: .06em; padding: 4px 9px; }
  .sticker.white { background: #fff; color: #0a0c0b; transform: rotate(3deg); }
  .obj { width: 100%; aspect-ratio: 1; display: block; }
  .kit { background: var(--surface); padding: 10px 8px 12px; text-align: center; position: relative; }
  .kit .name { font-family: var(--wide); font-weight: 800; font-variation-settings: "wdth" 115; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  .kit.packed::after { content: "✓"; position: absolute; top: 6px; right: 8px; width: 20px; height: 20px; display: grid; place-items: center; background: var(--red); color: #fff; font-size: 12px; font-weight: 900; border-radius: 50%; }
  .day { text-align: center; }
  .day .dl { font-family: var(--wide); font-weight: 800; font-variation-settings: "wdth" 115; font-size: 11px; color: var(--muted); }
  .day .cell { height: 46px; margin-top: 5px; display: grid; place-items: center; background: var(--surface-2); font-family: var(--wide); font-weight: 800; font-variation-settings: "wdth" 110; font-size: 8px; letter-spacing: .03em; position: relative; }
  .day .cell img { width: 34px; height: 34px; }
  .day .cell.game { display: flex; flex-direction: column; justify-content: center; gap: 1px; color: #fff; }
  .day .cell.game img { width: 40px; height: 28px; object-fit: cover; }
  .day .cell.game { background: var(--red); }
  .day .cell.today { outline: 2px solid var(--text); outline-offset: 2px; }
  .day .cell.rest { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
</style>
</head>
<body>
<div class="phone" style="padding-bottom:110px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div class="w" style="font-size:19px">Training<span style="color:var(--red)"> Agent</span></div>
    <span class="sticker white">MON 26 OCT</span>
  </div>

  <div class="hero">
    <canvas id="scene"></canvas>
    <div style="position:absolute;left:0;right:0;top:0;height:55%;background:linear-gradient(to bottom,rgba(10,12,11,.85),rgba(10,12,11,0));pointer-events:none"></div>
    <div style="position:absolute;left:16px;right:16px;top:18px">
      <div style="display:flex;gap:8px;align-items:center"><span class="sticker">MD-2</span><span class="eyebrow" style="color:#fff">Today · 17:30</span></div>
      <h1 class="w" style="font-size:31px;color:#fff;margin:10px 0 0;text-shadow:0 2px 12px rgba(0,0,0,.6)">Close control<br>&amp; 1v1</h1>
    </div>
    <div style="position:absolute;left:16px;bottom:18px"><span class="kick skew"><span>KICK OFF →</span></span></div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px">
    <div class="w" style="font-size:16px">Kit check</div><span class="muted" style="font-size:13px">tap to pack</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
    <div class="kit packed"><img class="obj" id="i-boot" alt="boots"><div class="name">Boots</div></div>
    <div class="kit packed"><img class="obj" id="i-ball" alt="ball"><div class="name">Ball</div></div>
    <div class="kit"><img class="obj" id="i-cone" alt="cones"><div class="name">6 cones</div></div>
    <div class="kit"><img class="obj" id="i-bottle" alt="water"><div class="name">Water</div></div>
  </div>

  <div class="w" style="font-size:16px;margin:24px 0 10px">This week</div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">
    <div class="day"><div class="dl">M</div><div class="cell today"><img class="d-ball"></div></div>
    <div class="day"><div class="dl">T</div><div class="cell rest">REST</div></div>
    <div class="day"><div class="dl">W</div><div class="cell game"><img class="d-goal"><span>GAME</span></div></div>
    <div class="day"><div class="dl">T</div><div class="cell">RECOV</div></div>
    <div class="day"><div class="dl">F</div><div class="cell"><img class="d-ball"></div></div>
    <div class="day"><div class="dl">S</div><div class="cell">CHEER</div></div>
    <div class="day"><div class="dl">S</div><div class="cell">GYM</div></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
    <div class="tile"><div class="label">Sessions this month</div><div class="value">9</div>
      <div class="delta" style="color:var(--good)">▲ 2 vs September</div></div>
    <div class="tile"><div class="label">Juggling best</div><div class="value">64<span class="unit">touches</span></div>
      <div class="delta" style="color:var(--good)">▲ 11 vs last test</div></div>
  </div>

  <div class="tabbar"><div class="tab on">Home</div><div class="tab">Week</div><div class="tab">Player</div><div class="tab">Coach</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- low-poly football objects ----------
const RED = 0xff2d46, WHITE = 0xf4f4f1, BLACK = 0x111214, DARKRED = 0xa8001c;
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .6, ...o });

function makeBall() {
  const g = new THREE.IcosahedronGeometry(1, 2);
  const spots = [];
  const base = new THREE.IcosahedronGeometry(1, 0).attributes.position;
  for (let i = 0; i < base.count; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(base, i).normalize();
    if (!spots.some((s) => s.distanceTo(v) < 1e-3)) spots.push(v);
  }
  const pos = g.attributes.position, colors = [];
  for (let f = 0; f < pos.count; f += 3) {
    let dark = false;
    for (let k = 0; k < 3; k++) {
      const v = new THREE.Vector3().fromBufferAttribute(pos, f + k).normalize();
      if (spots.some((s) => s.distanceTo(v) < 1e-3)) dark = true;
    }
    const col = new THREE.Color(dark ? BLACK : WHITE);
    for (let k = 0; k < 3; k++) colors.push(col.r, col.g, col.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .5 }));
  m.castShadow = true;
  return m;
}

function makeCone() {
  const grp = new THREE.Group();
  const parts = [[0.62, 0.50, 0.45, RED], [0.50, 0.40, 0.22, WHITE], [0.40, 0.12, 0.55, RED]];
  let y = 0.06;
  for (const [rb, rt, h, c] of parts) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 10), mat(c));
    p.position.y = y + h / 2; y += h; p.castShadow = true; grp.add(p);
  }
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 1.5), mat(DARKRED));
  base.position.y = 0.06; base.castShadow = true; grp.add(base);
  return grp;
}

function makeGoal(w = 6, h = 2.4, d = 1.8) {
  const grp = new THREE.Group(), r = 0.09, white = mat(WHITE, { roughness: .3 });
  const post = (x) => { const p = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 8), white); p.position.set(x, h / 2, 0); p.castShadow = true; grp.add(p); };
  post(-w / 2); post(w / 2);
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w + r * 2, 8), white);
  bar.rotation.z = Math.PI / 2; bar.position.y = h; bar.castShadow = true; grp.add(bar);
  // net: grid lines from crossbar back/down to the ground
  const pts = [], step = 0.3;
  for (let x = -w / 2; x <= w / 2 + 1e-6; x += step) { pts.push(x, h, 0, x, 0, -d); }
  for (let t = 0; t <= 1 + 1e-6; t += 0.125) { const y = h * (1 - t), z = -d * t; pts.push(-w / 2, y, z, w / 2, y, z); }
  for (const s of [-1, 1]) for (let t = 0; t <= 1 + 1e-6; t += 0.2) { pts.push(s * w / 2, h * (1 - t), -d * t, s * w / 2, 0, -d * t); }
  const net = new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .45 }));
  grp.add(net);
  return grp;
}

function makeBoot() {
  const grp = new THREE.Group();
  const sole = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.16, 0.85), mat(BLACK)); sole.position.y = 0.22; grp.add(sole);
  const upper = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.62, 0.8), mat(RED)); upper.position.set(-0.4, 0.6, 0); grp.add(upper);
  const toe = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), mat(RED)); toe.scale.set(1.25, 0.62, 0.8); toe.position.set(0.55, 0.4, 0); grp.add(toe);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 0.28, 8), mat(BLACK)); collar.position.set(-0.6, 1.0, 0); grp.add(collar);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 0.82), mat(WHITE)); stripe.position.set(-0.1, 0.55, 0); stripe.rotation.z = 0.35; grp.add(stripe);
  for (const x of [-0.85, -0.35, 0.35, 0.85]) for (const z of [-0.25, 0.25]) {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.16, 6), mat(WHITE)); s.position.set(x, 0.07, z); grp.add(s);
  }
  grp.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return grp;
}

function makeBottle() {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.5, 10), mat(BLACK, { roughness: .35 })); body.position.y = 0.75; grp.add(body);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.3, 10), mat(RED)); band.position.y = 0.9; grp.add(band);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 0.3, 10), mat(WHITE)); cap.position.y = 1.65; grp.add(cap);
  return grp;
}

function lights(scene, warm = true) {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x1f3a26, 0.75));
  const sun = new THREE.DirectionalLight(warm ? 0xffc28a : 0xffffff, 1.15);
  sun.position.set(-4, 7, 5); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0xff2d46, 0.55); rim.position.set(5, 3, -6); scene.add(rim);
}

// ---------- hero scene ----------
const canvas = document.getElementById('scene');
const W = canvas.clientWidth, H = canvas.clientHeight;
const r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(W, H, false); r.shadowMap.enabled = true;
const scene = new THREE.Scene();
const sky = document.createElement('canvas'); sky.width = 2; sky.height = 256;
const sg = sky.getContext('2d'), grad = sg.createLinearGradient(0, 0, 0, 256);
grad.addColorStop(0, '#0a0c0b'); grad.addColorStop(0.55, '#2a0a10'); grad.addColorStop(0.8, '#a3241a'); grad.addColorStop(1, '#ff7a3d');
sg.fillStyle = grad; sg.fillRect(0, 0, 2, 256);
scene.background = new THREE.CanvasTexture(sky);
scene.fog = new THREE.Fog(0x1a0d0c, 10, 26);
lights(scene);
const turf = new THREE.Mesh(new THREE.PlaneGeometry(60, 60, 30, 30), mat(0x1d4a2b, { roughness: 1 }));
turf.rotation.x = -Math.PI / 2; turf.receiveShadow = true; scene.add(turf);
for (let i = -6; i <= 6; i += 2) { // mowing bands
  const band = new THREE.Mesh(new THREE.PlaneGeometry(2, 60), mat(0x22552f, { roughness: 1 }));
  band.rotation.x = -Math.PI / 2; band.position.set(i * 2, 0.005, 0); band.receiveShadow = true; scene.add(band);
}
const line = new THREE.Mesh(new THREE.PlaneGeometry(30, 0.12), mat(0xffffff, { roughness: 1 }));
line.rotation.x = -Math.PI / 2; line.rotation.z = 0.12; line.position.set(0, 0.01, 1.2); scene.add(line);
const goal = makeGoal(); goal.position.set(1.2, 0, -7); goal.rotation.y = -0.12; scene.add(goal);
const ball = makeBall(); ball.scale.setScalar(0.5); ball.position.set(1.9, 0.5, 2.2); ball.rotation.set(0.3, 0.8, 0.2); scene.add(ball);
[[-1.6, -5.2], [0.4, -4.4], [2.4, -5.4], [4.2, -4.2]].forEach(([x, z], i) => {
  const c = makeCone(); c.scale.setScalar(0.62); c.position.set(x, 0, z); c.rotation.y = i; scene.add(c);
});
const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
cam.position.set(0.4, 1.7, 7.2); cam.lookAt(0.9, 1.6, -2);
r.render(scene, cam);

// ---------- object icons (transparent renders) ----------
const ir = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
ir.setPixelRatio(1); ir.setSize(256, 256); ir.shadowMap.enabled = true;
function icon(obj, camPos, look, scale = 1) {
  const s = new THREE.Scene(); lights(s, false);
  obj.scale.multiplyScalar(scale); s.add(obj);
  const c = new THREE.PerspectiveCamera(35, 1, 0.1, 100); c.position.set(...camPos); c.lookAt(...look);
  ir.render(s, c); return ir.domElement.toDataURL();
}
const urls = {
  ball: icon(makeBall(), [2.2, 1.6, 3.2], [0, 0, 0]),
  cone: icon(makeCone(), [2.0, 1.9, 2.6], [0, 0.5, 0]),
  boot: (() => { const b = makeBoot(); b.rotation.y = 0.5; return icon(b, [2.4, 2.0, 3.0], [0, 0.45, 0]); })(),
  bottle: icon(makeBottle(), [2.0, 1.8, 2.8], [0, 0.85, 0]),
  goal: (() => { const g = makeGoal(); g.rotation.y = 0.5; return icon(g, [0, 1.6, 5.4], [0, 1.1, -0.6]); })(),
};
document.getElementById('i-ball').src = urls.ball;
document.getElementById('i-cone').src = urls.cone;
document.getElementById('i-boot').src = urls.boot;
document.getElementById('i-bottle').src = urls.bottle;
document.querySelectorAll('.d-ball').forEach((e) => (e.src = urls.ball));
document.querySelectorAll('.d-goal').forEach((e) => (e.src = urls.goal));
window.__ready = true;
</script>
</body>
</html>
