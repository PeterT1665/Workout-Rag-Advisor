<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="shared.css"></head><body><!-- inline icon sprites, reused by mockups -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l3.5 2.5-1.3 4h-4.4l-1.3-4z"/><path d="M12 3v4M20.5 9.5l-5 0M17.5 19l-3.3-5.5M6.5 19l3.3-5.5M3.5 9.5h5"/></symbol>
  <symbol id="cone" viewBox="0 0 24 24"><path d="M9 4h6l4 15H5z"/><path d="M3 20h18M7.5 12h9"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></symbol>
  <symbol id="wave" viewBox="0 0 24 24"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>
<div class="phone">
  <div class="muted" style="font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:13px">‹ BACK</div>
  <div style="display:flex;gap:8px;align-items:center;margin-top:16px"><span class="tag">MD-2</span><span class="eyebrow">Football · 62 min</span></div>
  <h1 class="d" style="font-size:48px;margin:8px 0 16px">Close control &amp; 1v1</h1>
  <div style="display:flex;height:12px;gap:2px"><div style="flex:180;height:100%;background:var(--muted);"></div><div style="flex:150;height:100%;background:var(--muted);"></div><div style="flex:156;height:100%;background:var(--muted);"></div><div style="flex:270;height:100%;background:var(--red);"></div><div style="flex:318;height:100%;background:var(--red);"></div><div style="flex:360;height:100%;background:var(--red);"></div><div style="flex:450;height:100%;background:var(--red);"></div><div style="flex:450;height:100%;background:var(--red);"></div><div style="flex:680;height:100%;background:var(--red);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 3px,transparent 3px 7px);"></div><div style="flex:400;height:100%;background:var(--red);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 3px,transparent 3px 7px);"></div><div style="flex:300;height:100%;background:var(--muted);"></div></div>
  <div class="muted" style="display:flex;justify-content:space-between;margin-top:7px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em"><span>KICK-OFF</span><span>HALF-TIME</span><span>FULL-TIME</span></div>
  <div class="d" style="font-size:22px;margin:22px 0 2px">The drills</div>
  <div style="display:grid;grid-template-columns:150px 1fr;background:var(--surface);margin-top:10px">
  <div class="turf" style="height:104px"><svg viewBox="0 0 160 110" style="width:100%;height:100%" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M25 95L30 84L35 95Z" fill="#ffd23f" stroke="none"/><path d="M55 35L60 24L65 35Z" fill="#ffd23f" stroke="none"/><path d="M85 95L90 84L95 95Z" fill="#ffd23f" stroke="none"/><path d="M115 35L120 24L125 35Z" fill="#ffd23f" stroke="none"/><path d="M135 85L140 74L145 85Z" fill="#ffd23f" stroke="none"/><circle cx="14" cy="58" r="6" fill="#fff"/><path d="M20 58 C40 95,50 95,62 40 S85 20,92 80 S115 95,122 40 S140 30,146 70" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/></svg></div>
  <div style="padding:12px 14px">
    <div class="d" style="font-size:20px;line-height:1">Dribble + change direction</div>
    <div style="font-family:var(--body);font-weight:600;font-size:15px;margin-top:8px">6 × 45s · rest 30s</div>
    <div class="muted" style="display:flex;gap:10px;margin-top:6px;font-size:13px"><span class="chip" style="font-size:13px;color:var(--muted)"><svg class="icon"><use href="#ball"/></svg></span><span class="chip" style="font-size:13px;color:var(--muted)"><svg class="icon"><use href="#cone"/></svg>5</span></div>
    
  </div></div>
  <div style="display:grid;grid-template-columns:150px 1fr;background:var(--surface);margin-top:10px">
  <div class="turf" style="height:104px"><svg viewBox="0 0 160 110" style="width:100%;height:100%" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M105 60L110 49L115 60Z" fill="#ffd23f" stroke="none"/><circle cx="30" cy="55" r="6" fill="#fff"/><path d="M38 55H96" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/><path d="M100 55 L128 22 M100 55 L128 88" stroke="var(--red)" stroke-width="3"/><path d="M122 20l7 1-2 7M122 90l7-1-2-7" stroke="var(--red)" stroke-width="3"/><text x="132" y="22" fill="#fff" font-size="11" font-family="Barlow Condensed" font-weight="800">L</text><text x="132" y="96" fill="#fff" font-size="11" font-family="Barlow Condensed" font-weight="800">R</text></svg></div>
  <div style="padding:12px 14px">
    <div class="d" style="font-size:20px;line-height:1">1v1 reaction</div>
    <div style="font-family:var(--body);font-weight:600;font-size:15px;margin-top:8px">8 × 40s · rest 45s</div>
    <div class="muted" style="display:flex;gap:10px;margin-top:6px;font-size:13px"><span class="chip" style="font-size:13px;color:var(--muted)"><svg class="icon"><use href="#ball"/></svg></span><span class="chip" style="font-size:13px;color:var(--muted)"><svg class="icon"><use href="#cone"/></svg>1</span></div>
    <span class="tag" style="margin-top:8px">VOICE CUES</span>
  </div></div>
  <div style="display:grid;grid-template-columns:150px 1fr;background:var(--surface);margin-top:10px">
  <div class="turf" style="height:104px"><svg viewBox="0 0 160 110" style="width:100%;height:100%" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="140" y="8" width="8" height="94" fill="rgba(255,255,255,.75)"/><circle cx="40" cy="55" r="6" fill="#fff"/><path d="M48 50 L136 30 M136 80 L48 60" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/><path d="M128 27l8 3-6 6M56 66l-8-6 9-2" stroke="#fff" stroke-width="2"/></svg></div>
  <div style="padding:12px 14px">
    <div class="d" style="font-size:20px;line-height:1">Wall passes, both feet</div>
    <div style="font-family:var(--body);font-weight:600;font-size:15px;margin-top:8px">5 × 60s · rest 30s</div>
    <div class="muted" style="display:flex;gap:10px;margin-top:6px;font-size:13px"><span class="chip" style="font-size:13px;color:var(--muted)"><svg class="icon"><use href="#ball"/></svg></span><span style="font-weight:600">wall</span></div>
    
  </div></div>
  <div class="btn" style="width:100%;margin-top:18px">Kick off <svg class="icon"><use href="#arrow"/></svg></div>
</div></body></html>
